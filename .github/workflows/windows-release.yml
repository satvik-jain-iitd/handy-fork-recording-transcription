name: "Windows Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022] # Switch to stable Windows 2022

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja

      - name: Shorten build path (Windows)
        shell: pwsh
        run: |
          $targetDir = "C:\r" # Use C:\r for maximum path savings
          if (!(Test-Path $targetDir)) {
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          }
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      - name: install dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Handy v__VERSION__ - Offline Meeting Transcription Update"
          releaseBody: |
            ## 🎙️ Major Update: Offline Meeting & File Transcription
            
            This release transforms Handy into a complete offline AI meeting assistant! 🚀
            
            ### 🌟 Key Improvements:
            - **Live Meeting Transcription**: Transcribe live calls from **Webex, Zoom, Teams, Slack**, and more.
            - **Dual-Channel Audio**: Simultaneously records your Mic and System/Speaker output.
            - **Local File Upload**: Transcribe any pre-recorded audio or video file (`.mp3`, `.wav`, `.mp4`, etc.).
            - **macOS Loopback**: Native support for **ScreenCaptureKit** (no virtual drivers needed!).
            - **Windows WASAPI**: High-performance system audio capture.
            - **Transcription History**: Save, revisit, and export your transcripts to `.txt` files.
            
            ### 🛠️ Proxy/Offline Installation (Portable):
            1. Download the `.exe` (Windows) or `.dmg` (Mac).
            2. Create a folder and place the app inside.
            3. Create an empty file named `portable` next to the app.
            4. Manually place Whisper models in `Data/models/`.
            
            ---
            *Built with privacy and performance in mind. 100% Offline.*
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
