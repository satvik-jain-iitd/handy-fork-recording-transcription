name: "Windows Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Shorten build path (Windows)
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: install dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Handy v__VERSION__ - Offline Transcription Update"
          releaseBody: |
            ## 🎙️ Local Meeting Transcription (Offline)
            This update brings powerful offline transcription capabilities directly to Handy!

            ### Key Features:
            - **Local Inference**: Transcribe meetings entirely on your machine. No cloud APIs, no data leaves your device.
            - **Multi-Format Support**: Upload `.wav`, `.mp3`, `.m4a`, `.mp4`, `.mkv`, and `.webm` files.
            - **Model Discovery**: Automatically detects installed Whisper, Parakeet, and Moonshine models.
            - **Chunked Pipeline**: Efficiently processes long recordings (tested up to 30+ minutes) with minimal memory footprint.
            - **Smart Stitching**: Automatic boundary deduplication for seamless final transcripts.
            - **Session History**: Revisit past transcriptions and export them to `.txt` anytime.

            ### How to Use:
            1. Go to the new **Transcription** tab in the sidebar.
            2. Select an audio or video file.
            3. Choose your Whisper model.
            4. Click **Start Transcription** and watch the progress in real-time.

            ---
            *Built for Windows (x64).*
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
